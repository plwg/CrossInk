[workspace]
members = [".", "crates/inki-core"]
exclude = ["crates/inki-ffi"]

[package]
name = "inki"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "PC companion for an Anki-style flashcard app on CrossInk e-readers"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.10", features = ["derive"] }
fsrs = "7.0.0"
inki-core = { version = "0.3.0", path = "crates/inki-core" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
zstd = "0.14.5"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
